# Production automation, live entity id: automation.system_power_annoucnement
# (config id 1784346579944). Spoken TTS announcement, fires each time
# battery SOC crosses a new 10% boundary.
#
# CUT OVER 2026-08-22: message template replaced with the static randomized
# phrasing developed/validated in power_comfort_announcement_trial.yaml.deleted
# (v5) — see docs/ha-automations.md for the full trial history (bug fixes,
# LLM prompt iterations, and why the LLM call was ultimately dropped in
# favor of hand-written phrasing on this hardware).
#
# REVISED 2026-08-22, same day: the night/low-SOC branches now prefer a
# real forecast comparison over the load% heuristic when one is available.
# sensor..._battery_time_remaining (MutaTrack's own BatteryForecastEngine,
# see custom_components/mutatrack/forecast.py) gives minutes until the
# battery hits its stop-SOC cutoff; compared against minutes until
# sun.sun's next_rising, that's a real time-vs-time answer instead of an
# arbitrary load% threshold. Falls back to the original load%>25 heuristic
# whenever that sensor is unknown/unavailable.
#
# REVISED 2026-08-23: added directionality. "Battery's at 20 percent" read
# the same whether the battery was falling toward 20% or climbing back up
# through it -- very different situations, especially overnight (falling
# = real depletion risk; rising = e.g. a grid/generator charge event,
# nothing to worry about). is_rising compares trigger.from_state to
# trigger.to_state (already available on the trigger, no new sensor
# lookups). The night/low-SOC branch is now falling-only -- a new sibling
# branch handles rising through the same threshold ("recovering
# overnight"), and the daytime/general branch split into rising vs
# falling phrase sets instead of one direction-blind set.
#
# Entity ids containing "i30000251520943825" are this install's inverter
# serial-derived suffix (auto-generated by MutaTrack's sensor.py from the
# API's device id) — will differ on any other install. Substitute the
# equivalent sensors for the target device's battery SOC and load entities.
# sensor.office_mutatrack_i30000251520943825_battery_time_remaining has an
# "office_" prefix not shared by the other MutaTrack sensors on this
# install (likely an HA area-naming artifact) — don't assume that prefix
# pattern holds on other installs either.
alias: "Announcement: System Power"
description: "announce power change every 10%"
triggers:
  - trigger: state
    entity_id: sensor.mutatrack_i30000251520943825_battsoc
conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and
         trigger.to_state is not none and
         trigger.from_state.state not in ['unknown', 'unavailable'] and
         trigger.to_state.state not in ['unknown', 'unavailable'] }}
  - condition: template
    value_template: >
      {{ (trigger.from_state.state | int(0) // 10) != (trigger.to_state.state | int(0) // 10) }}
actions:
  - action: tts.speak
    target:
      entity_id: tts.piper
    data:
      cache: true
      media_player_entity_id: media_player.vlc_telnet
      message: >
        {% set soc = trigger.to_state.state | int(0) %}
        {% set is_rising = trigger.to_state.state | int(0) > trigger.from_state.state | int(0) %}
        {% set hour = now().hour %}
        {% set is_night = hour >= 21 or hour < 6 %}
        {% if soc == 100 %}
        {% set phrases = ["Battery's fully charged.", "You're topped off at 100 percent.", "Fully charged and ready to go."] %}
        {% elif is_night and soc < 40 and not is_rising %}
        {% set remaining_state = states('sensor.office_mutatrack_i30000251520943825_battery_time_remaining') %}
        {% if remaining_state not in ['unknown', 'unavailable', 'none'] %}
        {% set minutes_to_sunrise = ((as_timestamp(state_attr('sun.sun', 'next_rising')) - as_timestamp(now())) / 60) | round(0) %}
        {% set at_risk = remaining_state | float < minutes_to_sunrise %}
        {% else %}
        {% set load = ((states('sensor.mutatrack_i30000251520943825_l1_phase_output_load_rate')|float(0) + states('sensor.mutatrack_i30000251520943825_loadpercent_l2')|float(0)) / 2) | round(0) %}
        {% set at_risk = load > 25 %}
        {% endif %}
        {% if at_risk %}
        {% set phrases = [
          "Battery's down to " ~ soc ~ " percent, and it's tight overnight -- worth easing off non-essentials.",
          "You're at " ~ soc ~ " percent with load running high; you could be cutting it close before sunrise.",
          soc ~ " percent and dropping fast -- might be worth switching off anything you don't need right now."
        ] %}
        {% else %}
        {% set phrases = [
          "Battery's at " ~ soc ~ " percent, but load's light enough that you'll comfortably make it to sunrise.",
          "You're at " ~ soc ~ " percent overnight -- nothing to worry about with how little you're drawing right now.",
          soc ~ " percent and holding steady; you should coast through to sunrise just fine."
        ] %}
        {% endif %}
        {% elif is_night and soc < 40 and is_rising %}
        {% set phrases = [
          "Battery's climbing back up to " ~ soc ~ " percent -- recovering nicely.",
          "Good news -- you're charging back up, now at " ~ soc ~ " percent.",
          soc ~ " percent and rising overnight."
        ] %}
        {% elif is_rising %}
        {% set phrases = ["Climbing to " ~ soc ~ " percent.", "You're up to " ~ soc ~ " percent now.", "Battery's risen to " ~ soc ~ " percent."] %}
        {% else %}
        {% set phrases = ["Battery's down to " ~ soc ~ " percent.", "You're at " ~ soc ~ " percent now, and dropping.", "Battery's slipped to " ~ soc ~ " percent."] %}
        {% endif %}
        {{ phrases | random }}
mode: single
