# Production automation, live entity id: automation.system_power_annoucnement
# (config id 1784346579944). Spoken TTS announcement, fires each time
# battery SOC crosses a new 10% boundary.
#
# CUT OVER 2026-08-22: message template replaced with the static randomized
# phrasing developed/validated in power_comfort_announcement_trial.yaml.deleted
# (v5) — see docs/ha-automations.md for the full trial history (bug fixes,
# LLM prompt iterations, and why the LLM call was ultimately dropped in
# favor of hand-written phrasing on this hardware).
#
# REVISED 2026-08-22, same day: the night/low-SOC branches now prefer a
# real forecast comparison over the load% heuristic when one is available.
# sensor..._battery_time_remaining (MutaTrack's own BatteryForecastEngine,
# see custom_components/mutatrack/forecast.py) gives minutes until the
# battery hits its stop-SOC cutoff; compared against minutes until
# sun.sun's next_rising, that's a real time-vs-time answer instead of an
# arbitrary load% threshold. Falls back to the original load%>25 heuristic
# whenever that sensor is unknown/unavailable.
#
# REVISED 2026-08-23: added directionality. "Battery's at 20 percent" read
# the same whether the battery was falling toward 20% or climbing back up
# through it -- very different situations, especially overnight (falling
# = real depletion risk; rising = e.g. a grid/generator charge event,
# nothing to worry about). is_rising compares trigger.from_state to
# trigger.to_state (already available on the trigger, no new sensor
# lookups). The night/low-SOC branch is now falling-only -- a new sibling
# branch handles rising through the same threshold ("recovering
# overnight"), and the daytime/general branch split into rising vs
# falling phrase sets instead of one direction-blind set.
#
# REVISED 2026-08-27: rewrote all phrasing in Jamaican Patois, and added a
# "personality of the day" -- a persona (chill/auntie/yute/rasta/sassy) is
# picked deterministically from day-of-year mod 5, so every announcement on
# a given calendar day uses the same voice/tone, and it rotates the next
# day. This is still static hand-written phrasing (no LLM call, no change
# to the underlying TTS engine) -- Piper has no Jamaican Patois voice
# model, so this changes the words spoken, not the accent/voice itself.
# Each personality has 2 phrase variants per branch for spread within a
# day, on top of the day-to-day personality rotation. See
# docs/ha-automations.md for why an LLM-generation approach was shelved on
# this hardware, and revisit that section if reviving LLM-based Patois
# translation on better hardware later.
#
# REVISED 2026-08-27, same day: bumped the two general (non-night,
# non-low-SOC) rising/falling branches from 2 to 3 phrase variants per
# personality -- those two branches see the most crossings by far (every
# ordinary daytime 10% change routes through them), so they were the most
# likely to feel repetitive.
#
# REVISED 2026-08-27, same day again: bumped the night+falling/low-SOC
# branches (at-risk and comfortable) to 3 variants too, matching the
# downward-cycle daytime branch above. The night+rising ("recovering")
# branch and the full-charge branch stay at 2 -- they're the upward/
# terminal cases, not the downward cycle this request was about.
#
# REVISED 2026-09-03: reverted all phrasing from Patois back to plain
# English. Piper reads Patois spellings phonetically as an English voice
# sounding out unfamiliar words, not with a Jamaican accent -- in practice
# that made the announcements hard to understand. Kept the exact same
# structure (persona-of-the-day selection, branch layout, 2-vs-3 variant
# counts per branch) and kept each persona's distinct tone/personality
# (chill/laid-back, auntie/caring-fussy, yute/hype, rasta/wise, sassy/
# blunt) -- only the words changed, translated to their closest English
# equivalent rather than dropped. See docs/ha-automations.md.
#
# Entity ids containing "i30000251520943825" are this install's inverter
# serial-derived suffix (auto-generated by MutaTrack's sensor.py from the
# API's device id) — will differ on any other install. Substitute the
# equivalent sensors for the target device's battery SOC and load entities.
# sensor.office_mutatrack_i30000251520943825_battery_time_remaining has an
# "office_" prefix not shared by the other MutaTrack sensors on this
# install (likely an HA area-naming artifact) — don't assume that prefix
# pattern holds on other installs either.
alias: "Announcement: System Power"
description: "announce power change every 10%"
triggers:
  - trigger: state
    entity_id: sensor.mutatrack_i30000251520943825_battsoc
conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and
         trigger.to_state is not none and
         trigger.from_state.state not in ['unknown', 'unavailable'] and
         trigger.to_state.state not in ['unknown', 'unavailable'] }}
  - condition: template
    value_template: >
      {{ (trigger.from_state.state | int(0) // 10) != (trigger.to_state.state | int(0) // 10) }}
actions:
  - action: tts.speak
    target:
      entity_id: tts.piper
    data:
      cache: true
      media_player_entity_id: media_player.vlc_telnet
      message: >
        {% set soc = trigger.to_state.state | int(0) %}
        {% set is_rising = trigger.to_state.state | int(0) > trigger.from_state.state | int(0) %}
        {% set hour = now().hour %}
        {% set is_night = hour >= 21 or hour < 6 %}
        {% set persona = ['chill', 'auntie', 'yute', 'rasta', 'sassy'][now().strftime('%j') | int % 5] %}
        {% if soc == 100 %}
        {% set by_persona = {
          'chill':  ["Battery's full up, everything's smooth.", "We're sitting at a hundred percent, nothing to worry about."],
          'auntie': ["Oh good, battery's fully charged, thank goodness for that!", "I'll tell you, we're at full charge now -- everything's safe."],
          'yute':   ["Hey, a hundred percent, we're topped off!", "Let's go, battery's maxed out, full hundred percent!"],
          'rasta':  ["Give thanks, the battery's full to a hundred percent -- the sun did its work.", "Blessings, a hundred percent, right on schedule."],
          'sassy':  ["A hundred percent, you're welcome.", "Full charge, I don't need to tell you twice."]
        } %}
        {% elif is_night and soc < 40 and not is_rising %}
        {% set remaining_state = states('sensor.office_mutatrack_i30000251520943825_battery_time_remaining') %}
        {% if remaining_state not in ['unknown', 'unavailable', 'none'] %}
        {% set minutes_to_sunrise = ((as_timestamp(state_attr('sun.sun', 'next_rising')) - as_timestamp(now())) / 60) | round(0) %}
        {% set at_risk = remaining_state | float < minutes_to_sunrise %}
        {% else %}
        {% set load = ((states('sensor.mutatrack_i30000251520943825_l1_phase_output_load_rate')|float(0) + states('sensor.mutatrack_i30000251520943825_loadpercent_l2')|float(0)) / 2) | round(0) %}
        {% set at_risk = load > 25 %}
        {% endif %}
        {% if at_risk %}
        {% set by_persona = {
          'chill':  ["Battery's down to " ~ soc ~ " percent, and it's tight tonight -- ease off the extra load.", soc ~ " percent, and I won't lie, load's high for this hour -- take it easy.", soc ~ " percent and dropping fast tonight -- might be time to cut back."],
          'auntie': ["Oh dear, battery's down to " ~ soc ~ " percent and it's tight tonight -- turn off what you don't need, please.", "Careful now, " ~ soc ~ " percent and load's high -- you'll want to watch it before morning.", "I'm warning you, " ~ soc ~ " percent and dropping quick -- ease up on the load."],
          'yute':   [soc ~ " percent and things are tight tonight -- cut the load, you feel me?", "Yo, load's high and we're at " ~ soc ~ " percent -- watch yourself before sunrise.", soc ~ " percent and slipping tonight -- cut back before it gets real tight."],
          'rasta':  [soc ~ " percent and the load's heavy tonight -- tread carefully, ease up on the power.", "We're down to " ~ soc ~ " percent -- mind how you use the energy before morning comes.", soc ~ " percent and the power's running low -- walk careful tonight."],
          'sassy':  [soc ~ " percent and load's high -- if you don't cut back, that's on you.", soc ~ " percent and tight tonight -- I already warned you.", soc ~ " percent and dropping -- didn't you hear me the first time?"]
        } %}
        {% else %}
        {% set by_persona = {
          'chill':  ["We're at " ~ soc ~ " percent but load's light, so we're good til morning.", soc ~ " percent, nothing out of the ordinary, you'll cruise til sunrise.", soc ~ " percent, load's easy, we'll glide right through to morning."],
          'auntie': ["I'll tell you, " ~ soc ~ " percent but load's light, so don't fret, we'll make it til sunrise.", soc ~ " percent overnight, but everything's cool, no need to worry tonight.", soc ~ " percent, but nothing to fret about, load's nice and light tonight."],
          'yute':   [soc ~ " percent but load's light, we're good, no stress.", "Easy does it, " ~ soc ~ " percent and load's not bothering us til morning.", soc ~ " percent, load's light, we're breezing through the night."],
          'rasta':  [soc ~ " percent, but the load's light so the journey's safe til sunrise.", "No worries, " ~ soc ~ " percent and the balance is good tonight.", soc ~ " percent, the load's light so the night's an easy walk."],
          'sassy':  [soc ~ " percent, load's light, so relax, everything's fine.", "Nothing to see here, " ~ soc ~ " percent and we're cool til morning.", soc ~ " percent, load's light -- you're worrying over nothing."]
        } %}
        {% endif %}
        {% elif is_night and soc < 40 and is_rising %}
        {% set by_persona = {
          'chill':  [soc ~ " percent and climbing, everything's coming back to normal.", "Battery's charging back up, now at " ~ soc ~ " percent, easy does it."],
          'auntie': ["Thank goodness, battery's coming back up, now at " ~ soc ~ " percent.", "Glad to see it, " ~ soc ~ " percent and rising back."],
          'yute':   ["Let's go, we're climbing back, now " ~ soc ~ " percent!", soc ~ " percent and rising, things are looking up."],
          'rasta':  ["Give thanks, the power's coming back, now " ~ soc ~ " percent.", soc ~ " percent and rising -- the energy's returning."],
          'sassy':  ["Look at that, back up to " ~ soc ~ " percent.", soc ~ " percent and climbing -- told you it would come back."]
        } %}
        {% elif is_rising %}
        {% set by_persona = {
          'chill':  ["Up to " ~ soc ~ " percent now, nice and steady.", soc ~ " percent, we're climbing slow and sure.", soc ~ " percent and still rising, nice and easy."],
          'auntie': ["Good, good, up to " ~ soc ~ " percent now.", soc ~ " percent, climbing nicely, I'm satisfied.", soc ~ " percent now, moving right along."],
          'yute':   ["Up to " ~ soc ~ " percent, we're on the way up!", soc ~ " percent now, climbing steady, big things.", soc ~ " percent and rising, love to see it!"],
          'rasta':  [soc ~ " percent, the power's rising like the sun.", "Climbing to " ~ soc ~ " percent, all is well.", soc ~ " percent, the power's building steady."],
          'sassy':  [soc ~ " percent now, easy money.", "Up to " ~ soc ~ " percent, no drama.", soc ~ " percent, keep it coming."]
        } %}
        {% else %}
        {% set by_persona = {
          'chill':  [soc ~ " percent now, still dropping little by little.", "Battery down to " ~ soc ~ " percent, nothing major.", soc ~ " percent now, just easing down a little."],
          'auntie': ["I'm keeping an eye on it, down to " ~ soc ~ " percent now.", soc ~ " percent, still dropping, but don't worry yet.", soc ~ " percent now, I'm noticing it drop a little."],
          'yute':   [soc ~ " percent now, small drop but we're still going.", "Down to " ~ soc ~ " percent, nothing major, just keep an eye on it.", soc ~ " percent now, just a tick down."],
          'rasta':  [soc ~ " percent now, the energy's settling down a little.", "Down to " ~ soc ~ " percent, but nothing's out of balance.", soc ~ " percent, the energy's easing off a little."],
          'sassy':  [soc ~ " percent now, still sliding, but nothing new.", "Down to " ~ soc ~ " percent, life goes on.", soc ~ " percent, ticking down as usual."]
        } %}
        {% endif %}
        {{ by_persona[persona] | random }}
mode: single
