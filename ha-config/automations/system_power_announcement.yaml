# Production automation, exported from the live HA instance 2026-08-22.
# Spoken TTS announcement, fires each time battery SOC crosses a new 10%
# boundary. Currently unchanged/untouched by the power-comfort trial below
# (see docs/ha-automations.md) — kept running in parallel for comparison.
#
# Entity ids containing "i30000251520943825" are this install's inverter
# serial-derived suffix (auto-generated by MutaTrack's sensor.py from the
# API's device id) — will differ on any other install. Substitute the
# equivalent sensor for the target device's battery SOC entity.
alias: "Announcement: System Power"
description: "announce power change every 10%"
triggers:
  - trigger: state
    entity_id: sensor.mutatrack_i30000251520943825_battsoc
conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and
         trigger.to_state is not none and
         trigger.from_state.state not in ['unknown', 'unavailable'] and
         trigger.to_state.state not in ['unknown', 'unavailable'] }}
  - condition: template
    value_template: >
      {{ (trigger.from_state.state | int(0) // 10) != (trigger.to_state.state | int(0) // 10) }}
actions:
  - action: tts.speak
    target:
      entity_id: tts.piper
    data:
      cache: true
      media_player_entity_id: media_player.vlc_telnet
      message: >
        {% set battery = trigger.to_state.state | int(0) %}
        {% if battery == 100 %}
        System is now fully charged.
        {% elif battery <= 20 %}
        System power is running low. Shutdown non-essential systems or prepare to switch to backup source.
        {% else %}
        System power now at {{ battery }} percent.
        {% endif %}
mode: single
